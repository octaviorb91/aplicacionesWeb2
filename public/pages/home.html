<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Catálogo de Productos - Home</title>
</head>
<body class="bg-gray-950 text-gray-300 min-h-screen font-sans">

    <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-bold tracking-wider text-white">El emporio de las maravillas</h1>
            <span id="lblSaludo" class="text-sm text-gray-400">Bienvenido, ...</span>
        </div>
        <div class="w-1/3">
            <input type="text" id="txtBuscar" placeholder="¿Qué estás buscando?" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-gray-200 focus:outline-none focus:border-gray-500">
        </div>
        <button id="btnCerrarSesion" class="text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-xl transition-all">
            Cerrar Sesión
        </button>
    </header>

    <main class="container mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <aside class="bg-gray-900 p-5 rounded-2xl border border-gray-800 h-fit">
            <h2 class="text-lg font-semibold text-white mb-4">Filtrar Productos</h2>
            
            <div class="space-y-3">
                <button class="btn-filtro w-full text-left bg-gray-800 hover:bg-gray-700 text-gray-200 p-3 rounded-xl transition-all font-medium" data-cat="todos">
                    Todos los productos
                </button>
                <button class="btn-filtro w-full text-left bg-gray-950 hover:bg-gray-700 p-3 rounded-xl transition-all" data-cat="computacion">
                    Computación & Periféricos
                </button>
                <button class="btn-filtro w-full text-left bg-gray-950 hover:bg-gray-700 p-3 rounded-xl transition-all" data-cat="celulares">
                    Celulares & Smartwatches
                </button>
                <button class="btn-filtro w-full text-left bg-gray-950 hover:bg-gray-700 p-3 rounded-xl transition-all" data-cat="consolas">
                    Consolas & Gaming
                </button>
                <button class="btn-filtro w-full text-left bg-gray-950 hover:bg-gray-700 p-3 rounded-xl transition-all" data-cat="hogar">
                    Hogar & Electrodomésticos
                </button>
            </div>
        </aside>

        <section class="col-span-1 lg:col-span-2">
            <h2 class="text-xl font-bold text-white mb-4">Catálogo</h2>
            <div id="contenedorProductos" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                </div>
        </section>

        <aside class="bg-gray-900 p-5 rounded-2xl border border-gray-800 h-fit sticky top-24">
            <h2 class="text-lg font-semibold text-white mb-4 flex justify-between items-center">
                <span>Carrito</span>
                <span id="badgeContador" class="bg-blue-600 text-white text-xs px-2.5 py-1 rounded-full">0</span>
            </h2>

            <div id="listaCarrito" class="space-y-3 max-h-60 overflow-y-auto mb-4 pr-1">
                <p class="text-gray-500 text-sm text-center py-4">El carrito está vacío.</p>
            </div>

            <div class="border-t border-gray-800 pt-4 space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">Total:</span>
                    <span id="txtTotal" class="text-xl font-bold text-white">$0</span>
                </div>
                
                <input type="text" id="txtDireccion" placeholder="Dirección de entrega (Opcional)" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none">

                <button id="btnFinalizarCompra" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    Finalizar Compra
                </button>
            </div>
        </aside>

    </main>

    <script type="module" src="./home.js"></script>
</body>
</html>
