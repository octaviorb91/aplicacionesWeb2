<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Emporio de las Maravillas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/iconEmporio.png">
</head>

<body data-bs-theme="dark">
    <!-- Buscador Superior -->
    <div class="bg-body-tertiary py-3">
        <div class="container d-flex justify-content-center">
            <div class="input-group" style="max-width: 500px;">
                <input type="text" class="form-control" placeholder="Buscar productos, marcas y más…" id="topSearchInput" />
                <button class="btn btn-primary" id="topSearchButton">Buscar</button>
            </div>
        </div>
    </div>

    <header>
        
    </header>

    <!-- Contenedor del Formulario -->
    <div class="container d-flex justify-content-center align-items-center my-5" style="min-height: 70vh;">
        <div class="card p-4 shadow-lg border border-secondary" style="max-width: 500px; width: 100%;">
            <h3 class="text-center mb-4 fw-bold text-primary">Crear Cuenta</h3>
            
            <!-- Contenedor para mostrar alertas dinámicas de error o éxito -->
            <div id="registerAlert"></div>

            <form id="registerForm">
                <!-- Fila de Nombre y Apellido -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="nombre" class="form-label fw-bold">Nombre:</label>
                        <input type="text" id="nombre" class="form-control bg-dark text-light border-secondary" placeholder="Tu nombre" required>
                    </div>
                    <div class="col-md-6">
                        <label for="apellido" class="form-label fw-bold">Apellido:</label>
                        <input type="text" id="apellido" class="form-control bg-dark text-light border-secondary" placeholder="Tu apellido" required>
                    </div>
                </div>

                <!-- Campo Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email:</label>
                    <input type="email" id="email" class="form-control bg-dark text-light border-secondary" placeholder="ejemplo@correo.com" required>
                </div>

                <!-- Campo Contraseña -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Contraseña:</label>
                    <input type="password" id="password" class="form-control bg-dark text-light border-secondary" placeholder="Crea tu contraseña" required>
                </div>

                <!-- Fila de Fecha de Nacimiento e Imagen -->
                <div class="mb-3">
                    <label for="date" class="form-label fw-bold">Fecha de nacimiento:</label>
                    <input type="date" id="date" class="form-control bg-dark text-light border-secondary" required>
                </div>

                <!-- Campo para Subir Foto de Perfil -->
                <div class="mb-4">
                    <label for="filePhoto" class="form-label fw-bold">Foto de perfil:</label>
                    <input type="file" id="filePhoto" accept="image/*" class="form-control bg-dark text-light border-secondary">
                    <div class="form-text text-muted">Selecciona una foto para personalizar tu cuenta.</div>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                    <i class="bi bi-person-plus-fill me-2"></i>Crear cuenta
                </button>
            </form>
            
            <p class="text-center mt-3 mb-0 small">
                ¿Ya tienes una cuenta? <a href="./inicioSesion.html" class="text-primary text-decoration-none">Inicia sesión aquí</a>
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 mt-5 bg-dark border-top border-secondary">
        <p class="mb-0 text-muted small">Compra protegida · Envíos gratis desde $15.000 a todos los universos · © 2026 Emporio de las maravillas</p>
    </footer>

    <script type="module" src="../index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="formulario.js"></script>
</body>

</html>
